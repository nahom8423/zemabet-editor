<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor - Zema Bet</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        void: '#000000',
                        panel: '#0a0a0a',
                        discord: '#5865F2',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: white; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        textarea, input { caret-color: #5865F2; }
        textarea:focus, input:focus { outline: none; }
        .tool-btn {
            color: #9ca3af;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tool-btn:hover { background-color: #222; color: white; }
        .tool-btn:active { transform: scale(0.95); background-color: #333; }
        .glass {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* PIN Lock Styles */
        .numpad-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            color: white;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .numpad-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }
        .numpad-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .pin-active {
            background-color: white !important;
            border-color: white !important;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-void">

    <div id="pinOverlay" class="fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center transition-opacity duration-500 select-none">
        <div class="mb-8 opacity-50">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>

        <div id="pinDisplay" class="flex space-x-6 mb-12">
            <div class="pin-dot w-3 h-3 rounded-full border border-gray-700 bg-transparent transition-all duration-200"></div>
            <div class="pin-dot w-3 h-3 rounded-full border border-gray-700 bg-transparent transition-all duration-200"></div>
            <div class="pin-dot w-3 h-3 rounded-full border border-gray-700 bg-transparent transition-all duration-200"></div>
            <div class="pin-dot w-3 h-3 rounded-full border border-gray-700 bg-transparent transition-all duration-200"></div>
        </div>

        <p id="pinError" class="absolute top-1/3 mt-20 text-red-500 font-mono text-[10px] tracking-widest opacity-0 transition-opacity">ACCESS DENIED</p>

        <div class="grid grid-cols-3 gap-x-8 gap-y-6">
            <button onclick="enterDigit('1')" class="numpad-btn">1</button>
            <button onclick="enterDigit('2')" class="numpad-btn">2</button>
            <button onclick="enterDigit('3')" class="numpad-btn">3</button>
            <button onclick="enterDigit('4')" class="numpad-btn">4</button>
            <button onclick="enterDigit('5')" class="numpad-btn">5</button>
            <button onclick="enterDigit('6')" class="numpad-btn">6</button>
            <button onclick="enterDigit('7')" class="numpad-btn">7</button>
            <button onclick="enterDigit('8')" class="numpad-btn">8</button>
            <button onclick="enterDigit('9')" class="numpad-btn">9</button>
            <div></div>
            <button onclick="enterDigit('0')" class="numpad-btn">0</button>
            <button onclick="backspace()" class="numpad-btn group">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-9.172a2 2 0 00-1.414.586L3 12z"/></svg>
            </button>
        </div>

        <input type="text" id="pinInput" maxlength="4" class="opacity-0 absolute pointer-events-none" autocomplete="off">
    </div>

    <nav class="flex justify-between items-center px-6 py-5 z-20 bg-void border-b border-white/5 relative">
        
        <div class="flex items-center space-x-3 w-1/3 relative">
            <div class="flex flex-col justify-center w-full">
                <span class="text-[10px] font-bold text-gray-600 uppercase tracking-widest mb-0.5">Current Channel</span>
                <button type="button" id="channelButton" class="w-full flex items-center text-white font-bold tracking-tight cursor-pointer hover:text-discord transition-colors group bg-transparent">
                    <span class="text-xl mr-0.5 opacity-50 group-hover:opacity-100 transition-opacity">#</span>
                    <span class="text-lg" id="channelLabel">Loading…</span>
                    <svg class="w-3 h-3 ml-2 opacity-30 group-hover:opacity-100 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
            </div>
        <div id="channelDropdown" class="absolute top-full left-0 mt-3 w-64 bg-[#0b0b0b] border border-white/10 rounded-2xl shadow-2xl p-2 hidden z-30">
                <div class="text-xs text-gray-500 px-2 py-1">Loading channels…</div>
            </div>
        </div>

        <div class="absolute left-1/2 transform -translate-x-1/2">
            <img src="saintyared.png?v=3" alt="Zen Logo" class="w-16 h-16 object-cover rounded-full border border-white/10 shadow-lg">
        </div>

        <div class="w-1/3"></div>
    </nav>

    <main class="flex-1 relative overflow-hidden max-w-4xl mx-auto w-full flex flex-col">
        <div class="flex-1 flex flex-col h-full">
            <div class="px-6 py-2 flex items-center gap-1 overflow-x-auto no-scrollbar border-b border-white/5 bg-void/50">
                <button onclick="performUndo()" class="tool-btn" title="Undo (Ctrl+Z)">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7v6h6"></path>
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                    </svg>
                </button>
                <button onclick="performRedo()" class="tool-btn" title="Redo (Ctrl+Shift+Z)">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 7v6h-6"></path>
                        <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
                    </svg>
                </button>
                <div class="w-px h-6 bg-white/10 mx-2"></div>
                <button onclick="formatText('**', '**')" class="tool-btn" title="Bold">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
                </button>
                <button onclick="formatText('*', '*')" class="tool-btn" title="Italic">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
                </button>
                <button onclick="formatText('__', '__')" class="tool-btn" title="Underline">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
                </button>
                <button onclick="formatText('~~', '~~')" class="tool-btn" title="Strikethrough">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.3 19c-1.67 1.16-3.87 1.63-5.93 1.07-3.65-1-5.57-5.26-4.29-9.53 1.15-3.83 4.66-5.83 8.07-4.82"/><path d="M4 12h16"/></svg>
                </button>
                <div class="w-px h-6 bg-white/10 mx-2"></div>
                <button onclick="formatText('```\n', '\n```')" class="tool-btn" title="Code Block">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </button>
                <button onclick="insertLink()" class="tool-btn" title="Insert Link">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-6 pt-4 pb-32 no-scrollbar">
                <input type="text" id="msgTitle" class="w-full bg-transparent text-3xl font-bold text-white placeholder-gray-700 mb-4" placeholder="Message Title..." autocomplete="off">
                <textarea id="msgContent" class="w-full h-full bg-transparent text-lg text-gray-300 leading-relaxed font-mono placeholder-gray-800 resize-none pb-32" placeholder="Start typing content..." spellcheck="false"></textarea>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full glass pb-8 pt-4 px-6 z-30">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex flex-col">
                <span id="charCount" class="text-xs font-mono text-gray-500">0 chars</span>
                <span id="chunkCount" class="text-[10px] font-mono text-gray-700 font-bold uppercase">1 Message</span>
            </div>
            <button onclick="saveAction()" id="saveBtn" class="bg-white text-black font-bold px-8 py-3 rounded-full text-sm hover:bg-gray-200 active:scale-95 transition-all flex items-center shadow-[0_0_15px_rgba(255,255,255,0.15)]">
                PUBLISH CHANGES
            </button>
        </div>
    </div>

    <script>
        // --- PIN LOCK LOGIC ---
        const pinOverlay = document.getElementById('pinOverlay');
        const pinInput = document.getElementById('pinInput');
        const pinDisplay = document.getElementById('pinDisplay');
        const pinDots = document.querySelectorAll('.pin-dot');
        const pinError = document.getElementById('pinError');
        const PIN_STORAGE_KEY = 'zen_pin_unlocked';
        const DASHBOARD_ACTOR_KEY = 'dashboard_actor';
        const CORRECT_PIN = '8479';

        let pinValue = '';

        function updatePinDots() {
            pinDots.forEach((dot, index) => {
                if (index < pinValue.length) {
                    dot.classList.add('pin-active');
                } else {
                    dot.classList.remove('pin-active');
                }
            });
            if (pinInput) {
                pinInput.value = pinValue;
            }
        }

        function showPinOverlay() {
            if (!pinOverlay) return;
            pinValue = '';
            updatePinDots();
            pinError?.classList.add('opacity-0');
            pinOverlay.style.display = 'flex';
            requestAnimationFrame(() => {
                pinOverlay.style.opacity = '1';
            });
            setTimeout(() => pinInput?.focus(), 100);
        }

        function hidePinOverlay() {
            if (!pinOverlay) return;
            pinOverlay.style.opacity = '0';
            setTimeout(() => {
                pinOverlay.style.display = 'none';
            }, 500);
        }

        function unlockSite() {
            if (!pinOverlay) return;
            pinDisplay?.classList.add('opacity-0', 'scale-110');
            setTimeout(() => {
                localStorage.setItem(PIN_STORAGE_KEY, '1');
                localStorage.setItem(DASHBOARD_ACTOR_KEY, `PIN-${CORRECT_PIN} user`);
                hidePinOverlay();
                pinDisplay?.classList.remove('opacity-0', 'scale-110');
            }, 200);
        }

        function showPinError() {
            if (pinDisplay) {
                pinDisplay.classList.add('shake');
                setTimeout(() => pinDisplay.classList.remove('shake'), 400);
            }
            pinError?.classList.remove('opacity-0');
            setTimeout(() => {
                pinValue = '';
                updatePinDots();
            }, 400);
        }

        function enterDigit(digit) {
            if (pinOverlay && pinOverlay.style.display === 'none') return;
            if (pinValue.length >= 4) return;
            pinValue += digit;
            pinError?.classList.add('opacity-0');
            updatePinDots();
            if (pinValue.length === 4) {
                if (pinValue === CORRECT_PIN) {
                    unlockSite();
                } else {
                    showPinError();
                }
            }
        }

        function backspace() {
            if (!pinValue.length) return;
            pinValue = pinValue.slice(0, -1);
            pinError?.classList.add('opacity-0');
            updatePinDots();
        }

        window.enterDigit = enterDigit;
        window.backspace = backspace;

        document.addEventListener('keydown', (event) => {
            if (pinOverlay && pinOverlay.style.display === 'none') {
                return;
            }
            if (event.key >= '0' && event.key <= '9') {
                enterDigit(event.key);
            } else if (event.key === 'Backspace') {
                backspace();
            }
        });

        if (pinOverlay) {
            if (localStorage.getItem(PIN_STORAGE_KEY) === '1') {
                pinOverlay.style.display = 'none';
                if (!localStorage.getItem(DASHBOARD_ACTOR_KEY)) {
                    localStorage.setItem(DASHBOARD_ACTOR_KEY, `PIN-${CORRECT_PIN} user`);
                }
            } else {
                showPinOverlay();
            }
        }

        document.addEventListener('keydown', (event) => {
            if (pinOverlay && pinOverlay.style.display !== 'none') {
                return;
            }
            const isCtrl = event.ctrlKey || event.metaKey;
            if (!isCtrl) {
                return;
            }
            const key = event.key.toLowerCase();
            if (key === 'z' && event.shiftKey) {
                event.preventDefault();
                performRedo();
            } else if (key === 'z') {
                event.preventDefault();
                performUndo();
            }
        });

        // --- Channel Selection Logic ---
        const channelButton = document.getElementById('channelButton');
        const channelLabel = document.getElementById('channelLabel');
        const channelDropdown = document.getElementById('channelDropdown');
        let channelMeta = {};
        let channelNames = {};
        let channelsConfig = {};
        let selectedChannelId = null;
        let chunkPreviewTimer = null;
        let chunkPreviewController = null;
        const API_BASE = window.API_BASE || "http://5.78.130.60:5044";

        const titleInput = document.getElementById('msgTitle');
        const contentInput = document.getElementById('msgContent');
        const charCount = document.getElementById('charCount');
        const chunkCount = document.getElementById('chunkCount');
        if (chunkCount) {
            chunkCount.textContent = 'Calculating…';
        }
        const MAX_CHUNK = 2000;
        const DRAFT_PREFIX = "zema_draft_";
        let draftSaveTimer = null;

        if (channelButton && channelDropdown) {
            channelButton.addEventListener('click', (event) => {
                event.stopPropagation();
                channelDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', (event) => {
                if (!channelDropdown.contains(event.target) && !channelButton.contains(event.target)) {
                    channelDropdown.classList.add('hidden');
                }
            });
        }

        function formatChannelLabel(channelId) {
            const name = channelNames[channelId];
            if (name) {
                return name.startsWith('#') ? name : `#${name}`;
            }
            return `#${channelId}`;
        }

        function buildGroupedChannelIds() {
            const grouped = {};
            const ids = Object.keys(channelsConfig);
            ids.forEach((id) => {
                const meta = channelMeta[id] || {};
                const category = meta.category || 'Uncategorized';
                if (!grouped[category]) {
                    grouped[category] = [];
                }
                grouped[category].push(id);
            });
            return grouped;
        }

        function populateChannelDropdown() {
            if (!channelDropdown) {
                return;
            }
            channelDropdown.innerHTML = '';
            const ids = Object.keys(channelsConfig);
            if (!ids.length) {
                channelDropdown.innerHTML = '<div class="text-xs text-gray-500 px-2 py-2">No static channels configured yet.</div>';
                channelLabel.textContent = 'No channels found';
                return;
            }
            const grouped = buildGroupedChannelIds();
            const categories = Object.keys(grouped).sort((a, b) => a.localeCompare(b));

            categories.forEach((category) => {
                const header = document.createElement('div');
                header.className = 'text-[11px] text-gray-500 uppercase tracking-widest px-3 pt-3 pb-1';
                header.textContent = category;
                channelDropdown.appendChild(header);

                grouped[category].forEach((id) => {
                    const entry = channelsConfig[id];
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = `w-full text-left px-4 py-2 rounded-xl transition-colors ${
                        id === selectedChannelId ? 'bg-discord/20 text-white border border-discord/40' : 'text-gray-300 hover:bg-white/5'
                    }`;
                    button.innerHTML = `
                        <div class="text-sm font-semibold">${formatChannelLabel(id)}</div>
                        <div class="text-[11px] text-gray-500 mt-1">${entry?.title ? entry.title.slice(0, 42) : 'Untitled static block'}</div>
                    `;
                    button.addEventListener('click', () => {
                        selectChannel(id);
                        channelDropdown.classList.add('hidden');
                    });
                    channelDropdown.appendChild(button);
                });
            });
        }

        async function loadChannels() {
            try {
                const response = await fetch(`${API_BASE}/api/channels`);
                if (!response.ok) {
                    throw new Error(`Failed to load channels (${response.status})`);
                }
                const payload = await response.json();
                channelsConfig = payload.channels || {};
                channelMeta = payload.channel_meta || {};
                channelNames = payload.channel_names || {};
                Object.entries(channelMeta).forEach(([id, meta]) => {
                    if (meta && meta.name && !channelNames[id]) {
                        channelNames[id] = meta.name;
                    }
                });
                populateChannelDropdown();
                const firstChannel = Object.keys(channelsConfig)[0];
                if (firstChannel) {
                    selectChannel(firstChannel);
                }
            } catch (error) {
                console.error(error);
                if (channelLabel) {
                    channelLabel.textContent = 'Unavailable';
                }
                if (channelDropdown) {
                    channelDropdown.innerHTML = '<div class="text-xs text-red-400 px-2 py-2">Failed to load channels</div>';
                }
            }
        }

        function selectChannel(channelId) {
            const entry = channelsConfig[channelId];
            if (!entry) {
                return;
            }
            selectedChannelId = channelId;
            if (channelLabel) {
                channelLabel.textContent = formatChannelLabel(channelId);
            }
            titleInput.value = entry.title || '';
            contentInput.value = entry.content || '';
            applyDraftIfAvailable(channelId);
            populateChannelDropdown();
            updateStats();
        }

        function applyDraftIfAvailable(channelId) {
            try {
                const raw = localStorage.getItem(`${DRAFT_PREFIX}${channelId}`);
                if (!raw) {
                    return;
                }
                const draft = JSON.parse(raw);
                if (typeof draft.title === 'string') {
                    titleInput.value = draft.title;
                }
                if (typeof draft.content === 'string') {
                    contentInput.value = draft.content;
                }
            } catch (error) {
                console.warn('Failed to load draft', error);
            }
        }

        function scheduleChunkPreview() {
            if (!chunkCount) {
                return;
            }
            chunkCount.textContent = 'Calculating…';
            if (chunkPreviewTimer) {
                clearTimeout(chunkPreviewTimer);
            }
            chunkPreviewTimer = setTimeout(runChunkPreview, 350);
        }

        async function runChunkPreview() {
            if (!titleInput || !contentInput) {
                return;
            }
            chunkPreviewTimer = null;
            if (chunkPreviewController) {
                chunkPreviewController.abort();
            }
            chunkPreviewController = new AbortController();
            try {
                const response = await fetch(`${API_BASE}/api/preview`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: titleInput.value.trim(),
                        content: contentInput.value,
                    }),
                    signal: chunkPreviewController.signal,
                });
                if (!response.ok) {
                    throw new Error('Preview failed');
                }
                const payload = await response.json();
                const count = payload.count ?? (Array.isArray(payload.segments) ? payload.segments.length : 1);
                chunkCount.textContent = `${count} Message${count === 1 ? '' : 's'}`;
            } catch (error) {
                if (error.name === 'AbortError') {
                    return;
                }
                chunkCount.textContent = 'Unknown';
            }
        }

        function performUndo() {
            if (!contentInput) {
                return;
            }
            contentInput.focus();
            document.execCommand('undo');
            setTimeout(() => {
                updateStats();
            }, 0);
        }

        function performRedo() {
            if (!contentInput) {
                return;
            }
            contentInput.focus();
            document.execCommand('redo');
            setTimeout(() => {
                updateStats();
            }, 0);
        }

        // --- Editor Logic ---
        function formatText(prefix, suffix) {
            const start = contentInput.selectionStart;
            const end = contentInput.selectionEnd;
            const text = contentInput.value;
            const selection = text.substring(start, end);
            const replacement = prefix + selection + suffix;
            contentInput.setRangeText(replacement, start, end, 'select');
            contentInput.focus();
            if (start === end) {
                contentInput.setSelectionRange(start + prefix.length, start + prefix.length);
            }
            updateStats();
        }

        function insertLink() {
            const url = prompt("Enter the URL:", "https://");
            if (!url) {
                return;
            }
            const start = contentInput.selectionStart;
            const end = contentInput.selectionEnd;
            const selection = contentInput.value.substring(start, end) || "Link Text";
            const markdown = `[${selection}](${url})`;
            contentInput.setRangeText(markdown, start, end, 'select');
            updateStats();
        }

        function updateStats() {
            const title = titleInput.value;
            const content = contentInput.value;
            const full = (title ? `**${title}**\n\n` : "") + content;
            charCount.innerText = `${full.length} chars`;
            if (full.length > 4000) {
                charCount.classList.add('text-red-500');
            } else {
                charCount.classList.remove('text-red-500');
            }
            scheduleChunkPreview();
            scheduleDraftSave();
        }

        function scheduleDraftSave() {
            if (!selectedChannelId) {
                return;
            }
            if (draftSaveTimer) {
                clearTimeout(draftSaveTimer);
            }
            draftSaveTimer = setTimeout(() => {
                const payload = {
                    title: titleInput.value,
                    content: contentInput.value,
                    updated: Date.now(),
                };
                try {
                    localStorage.setItem(`${DRAFT_PREFIX}${selectedChannelId}`, JSON.stringify(payload));
                } catch (error) {
                    console.warn('Could not save draft', error);
                }
            }, 400);
        }

        async function saveAction() {
            if (!selectedChannelId) {
                alert('Please select a channel before publishing.');
                return;
            }
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerText;
            btn.innerHTML = `<svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btn.style.backgroundColor = 'white';
            btn.style.color = 'black';

            try {
                const response = await fetch(`${API_BASE}/api/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        channelId: selectedChannelId,
                        title: titleInput.value.trim(),
                        content: contentInput.value,
                        actor: localStorage.getItem(DASHBOARD_ACTOR_KEY) || 'Web Dashboard',
                    }),
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || `Save failed (${response.status})`);
                }
                const payload = await response.json();
                channelsConfig[selectedChannelId] = channelsConfig[selectedChannelId] || {};
                channelsConfig[selectedChannelId].title = titleInput.value.trim();
                channelsConfig[selectedChannelId].content = contentInput.value;
                try {
                    localStorage.removeItem(`${DRAFT_PREFIX}${selectedChannelId}`);
                } catch (error) {
                    console.warn('Failed to clear draft', error);
                }
                btn.style.backgroundColor = '#23a559';
                btn.style.color = 'white';
                btn.innerText = 'PUBLISHED!';
            } catch (error) {
                console.error(error);
                btn.style.backgroundColor = '#b91c1c';
                btn.style.color = 'white';
                btn.innerText = 'ERROR';
                alert(`Failed to save changes: ${error.message}`);
            } finally {
                setTimeout(() => {
                    btn.style.backgroundColor = 'white';
                    btn.style.color = 'black';
                    btn.innerText = originalText;
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                }, 2000);
            }
        }


        titleInput.addEventListener('input', updateStats);
        contentInput.addEventListener('input', updateStats);
        updateStats();
        loadChannels();
    </script>
</body>
</html>
